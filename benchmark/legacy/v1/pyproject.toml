[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-automl"
version = "0.1.0"
description = "LLM-powered AutoML agent for tabular data"
requires-python = ">=3.10,<3.11"
dependencies = [
    "catboost==1.2.10",
    "click==8.1.8",
    "cloudpickle==3.1.2",
    "numpy==1.26.4",
    "onnx==1.21.0",
    "onnxmltools==1.16.0",
    "onnxruntime==1.23.2",
    "openai==2.15.0",
    "pandas==2.3.3",
    "pydantic==2.11.7",
    "python-dotenv==1.1.1",
    "questionary==2.1.1",
    "rich==14.0.0",
    "scikit-learn==1.7.0",
    "scipy==1.15.3",
    "skl2onnx==1.20.0",
    "tabulate==0.9.0",
]

[tool.setuptools]
py-modules = ["paths", "schemas"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "configuration*", "data*", "llms*", "models*", "prompts*", "sandbox*", "tools*"]
